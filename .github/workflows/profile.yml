name: Update profile assets

on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "0 23 * * 0"
  workflow_dispatch:
  push:
    paths: [.github/workflows/profile.yml]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  profile:
    name: Generate profile assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate snake graph
        id: snake
        if: github.event.schedule != '20 0 * * *'
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/github-snake.svg
            assets/github-snake-dark.svg?palette=github-dark

      - name: Generate streak stats
        id: streak
        if: github.event.schedule != '20 0 * * *'
        continue-on-error: true
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&theme=tokyonight&hide_border=true&timezone=Africa/Johannesburg&short_numbers=true&date_format=n%2Fj%5B%2FY%5D
          path: assets/streak.svg

      - name: Generate summary cards
        id: cards
        if: github.event.schedule != '20 0 * * *'
        continue-on-error: true
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARD_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          AUTO_PUSH: false
          TIME_ZONE: "Africa/Johannesburg"
          EXCLUDE: "shell"
          THEME: "tokyonight"
          ANIMATION: "load"
          DURATION: "2"
          NAME: "DoubledDoge"

      - name: Generate koi
        id: koi
        if: github.event.schedule != '0 23 * * 0'
        continue-on-error: true
        uses: yalongwastaken/git-koi@v1
        with:
          login: ${{ github.repository_owner }}
          body: gold
          output-dir: assets

      - name: Commit changed assets
        shell: bash
        run: |
          git add assets/ profile-summary-card-output/
          if git diff --cached --quiet; then
            echo "Nothing changed; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git commit --quiet --message "profile: refresh generated assets"
          git pull --rebase --quiet
          git push --quiet

      - name: Fail the run if any generator failed
        if: steps.snake.outcome == 'failure' || steps.streak.outcome == 'failure' || steps.cards.outcome == 'failure' || steps.koi.outcome == 'failure'
        run: |
          echo "At least one generator failed; see the steps above." >&2
          exit 1